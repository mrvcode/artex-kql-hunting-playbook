id: 00000000-0000-0000-0000-000000000000 # Reemplazar por un GUID v4 nuevo antes de importar
name: Una IP autentica contra varios service principals con resultados mixtos
description: |
  Detecta una misma IP que se autentica contra 3 o más service principals en una ventana
  corta, combinando fallos y éxitos. Patrón compatible con abuso de credenciales de aplicación
  por agentes autónomos.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AADServicePrincipalSignInLogs
queryFrequency: 30m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - CredentialAccess
relevantTechniques:
  - T1078.004
  - T1110
query: |
  let lookback = 1h;
  let window = 30m;
  let minSPNs = 3;
  AADServicePrincipalSignInLogs
  | where TimeGenerated >= ago(lookback)
  | summarize
      SPNs = dcount(ServicePrincipalId),
      Failures = countif(ResultType != "0"),
      Successes = countif(ResultType == "0"),
      Apps = make_set(ServicePrincipalName, 10)
      by IPAddress, bin(TimeGenerated, window)
  | where SPNs >= minSPNs and Failures > 0 and Successes > 0
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
eventGroupingSettings:
  aggregationKind: SingleAlert
version: 1.0.0
kind: Scheduled
